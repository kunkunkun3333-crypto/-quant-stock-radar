name: Test Quant Stock Radar

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - upgrade/v5.2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app_v4.py app_v51.py app_v52.py quant_stock_radar_v5.py v51_support.py v52_config.py v52_engine.py v52_data.py v52_backtest.py v52_cache.py v52_official.py app_v52_test.py

      - name: Test deterministic models and Streamlit UI
        run: python -m unittest discover -s tests -v
